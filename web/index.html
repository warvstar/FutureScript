<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fut</title>
<style>
  :root { color-scheme: dark; --bg: #14141c; --fg: #d8d8e0; --dim: #7a7a8c; --err: #ff7a7a; --line: #2a2a38; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 13px/1.45 ui-monospace, Menlo, monospace; display: flex; flex-direction: column; height: 100vh; }
  body > header { padding: 8px 16px; border-bottom: 1px solid var(--line); color: var(--dim); }
  body > header b { color: var(--fg); }
  body > main { flex: 1; display: flex; gap: 16px; padding: 16px; min-height: 0; flex-wrap: wrap; }
  #ui { flex: 3; min-width: 280px; overflow: auto; font: 15px/1.5 system-ui, sans-serif; } #ui:empty { display: none; }
  #ui:not(:empty) ~ #side { flex: 0 1 280px; }  /* a page gets the room; the output stays beside it */
  body > main:has(#ui:not(:empty)) { flex-wrap: nowrap; }  /* one line: the page's height is the window's, so it can scroll inside */
  #screen, #gpu { image-rendering: pixelated; background: #000; display: none; align-self: flex-start; width: min(640px, 100%); outline: none; }
  #side { flex: 1; min-width: 280px; display: flex; flex-direction: column; min-height: 0; }
  #out { flex: 1; margin: 0; overflow: auto; white-space: pre-wrap; word-break: break-word; }
  .e { color: var(--err); }
  #form { display: flex; border-top: 1px solid var(--line); padding-top: 8px; }
  #prompt { color: var(--dim); padding-right: 6px; }
  #problem { position: fixed; left: 16px; right: 16px; bottom: 16px; max-height: 40vh; overflow: auto; margin: 0; padding: 12px 40px 12px 14px;
    background: #2a1416; color: #ffd6d6; border: 1px solid #7a2a30; border-radius: 8px; white-space: pre-wrap; z-index: 99;
    font: 12.5px/1.5 ui-monospace, Menlo, monospace; box-shadow: 0 10px 30px rgb(0 0 0 / .4); }
  #problem[hidden] { display: none; }
  #problem button { position: absolute; top: 8px; right: 8px; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  #in { flex: 1; background: none; border: 0; color: var(--fg); font: inherit; outline: none; }
</style>
</head>
<body>
<header><b>fut</b> on WebAssembly<span id="mode"></span> · <span id="file"></span> · edits to the file hot-reload · type to poke the running program</header>
<main>
  <div id="ui"></div>
  <canvas id="screen" tabindex="0"></canvas>
  <canvas id="gpu" tabindex="0"></canvas>
  <div id="side">
    <pre id="out"></pre>
    <form id="form"><span id="prompt">&gt;</span><input id="in" autocomplete="off" spellcheck="false" autofocus></form>
  </div>
</main>
<pre id="problem" hidden role="alert"></pre>
<script type="module">
import { createFut } from "/web/fut.js";
const $ = (id) => document.getElementById(id);
const out = $("out"), canvas = $("screen"), ctx = canvas.getContext("2d"), gpuCanvas = $("gpu");
const params = new URLSearchParams(location.search), file = params.get("file");
// fut-mt.wasm (isolates in parallel, a worker each thread) where the page may share memory (web/serve.mjs's headers);
// ?threads=0: fut.wasm, on this thread; ?threads=n: at most n threads; ?proxy=all|none: see fut.js's proxy option;
// ?test: run the file's tests (fut test) instead
const threads = self.crossOriginIsolated && params.get("threads") != "0";
$("file").textContent = file ?? "REPL (add ?file=examples/paddle.fut)";
const decoders = { 1: new TextDecoder(), 2: new TextDecoder() };
function write(fd, bytes) {
  const s = document.createElement("span");
  s.textContent = decoders[fd].decode(bytes, { stream: true });
  if (fd == 2) s.className = "e";
  out.append(s), (out.scrollTop = out.scrollHeight);
}
let watched = new Set(), windowOpen = false;
let gpuPresent = null;  // while std/gpu draws the window: shows its frame (see screen)
const stamps = new Map();  // path -> how many times it changed: a package's JS modules load again when it moves
const host = {
  std: "/std",
  verbose: true,
  serve: true,  // a program that builds a page (std/ui, into #ui) keeps handling its events after it finishes
  write,
  // what's wrong now (a reload that doesn't compile, a runtime error), over the page until the next good reload
  problem(text) {
    const p = $("problem");
    if (!text) return void (p.hidden = true);
    p.textContent = text;
    const x = document.createElement("button");
    x.textContent = "✕", x.title = "Hide", x.onclick = () => (p.hidden = true);
    p.append(x), (p.hidden = false);
  },
  files: (f) => (watched = new Set(f)),
  window(w, h) {
    for (const c of [canvas, gpuCanvas]) c.width = w, c.height = h;
    const c = gpuPresent ? gpuCanvas : canvas;
    return (windowOpen = true), (c.style.display = "block"), c.focus(), true;
  },
  async present(rgba, w, h) {
    if (gpuPresent) gpuPresent();
    else ctx.putImageData(new ImageData(rgba, w, h), 0, 0);
    await new Promise(requestAnimationFrame);
    return true;
  },
  // The window, for a module that draws it with WebGPU (std/gpu): a canvas can't have a 2d context and a webgpu one,
  // so it gets a canvas of its own in the window's place, with the same size and input
  screen: {
    take(present) {
      if (!windowOpen) return null;
      (gpuPresent = present), (canvas.style.display = "none"), (gpuCanvas.style.display = "block"), gpuCanvas.focus();
      return gpuCanvas;
    },
    give() {
      gpuPresent = null, (gpuCanvas.style.display = "none");
      if (windowOpen) (canvas.style.display = "block"), canvas.focus();
    },
  },
};
let fut;
if (threads) {
  const { startFut } = await import("/web/browser.js");
  const wasm = new Uint8Array(await (await fetch("/build/fut-mt.wasm")).arrayBuffer());
  fut = await startFut({ ...host, wasm, poolSize: +params.get("threads") || undefined, proxy: params.get("proxy") ?? undefined });
  $("mode").textContent = ` (threads: ${+params.get("threads") || navigator.hardwareConcurrency})`;
} else {
  const f = await createFut({ ...host, wasm: await (await fetch("/build/fut.wasm")).arrayBuffer(), read, importModule: (p, stamp) => import(p + "?v=" + stamp), stamp: (p) => stamps.get(p) ?? 0 });
  fut = {
    run: f.run, line: f.line, type: f.type, test: (file) => f.test(file, false, ""),
    changed: (p) => (stamps.set(p, (stamps.get(p) ?? 0) + 1), f.changed()),
    key: (c, down) => f.exports.fut_key(c, down),
    mouse: (x, y, down) => f.exports.fut_mouse(x, y, down),
  };
}
function read(p) {  // fut reads files synchronously
  const x = new XMLHttpRequest();
  x.open("GET", p.replace(/^\/+/, "/"), false), x.overrideMimeType("text/plain; charset=x-user-defined");  // ("//x": another host)
  try { x.send(); } catch { return null; }
  if (x.status != 200) return null;
  const b = new Uint8Array(x.responseText.length);
  for (let i = 0; i < b.length; i++) b[i] = x.responseText.charCodeAt(i) & 0xff;
  return b;
}
// keys: the codes key() looks up (arrows as AppKit numbers them)
const named = { ArrowUp: 0xf700, ArrowDown: 0xf701, ArrowLeft: 0xf702, ArrowRight: 0xf703, Enter: 13, Escape: 27, Tab: 9 };
const code = (e) => named[e.key] ?? (e.key.length == 1 ? e.key.toLowerCase().charCodeAt(0) : -1);
let mouseDown = 0;
const mouse = (e) => {
  const c = gpuPresent ? gpuCanvas : canvas, r = c.getBoundingClientRect();
  fut.mouse((e.clientX - r.left) * c.width / r.width, (e.clientY - r.top) * c.height / r.height, mouseDown);
};
for (const c of [canvas, gpuCanvas]) {  // the window: the pixel buffer's canvas, or std/gpu's
  for (const [type, down] of [["keydown", 1], ["keyup", 0]])
    c.addEventListener(type, (e) => { const k = code(e); if (k >= 0) fut.key(k, down), e.preventDefault(); });
  c.addEventListener("mousemove", mouse);
  c.addEventListener("mousedown", (e) => ((mouseDown = 1), mouse(e)));
}
addEventListener("mouseup", (e) => ((mouseDown = 0), mouse(e)));

let running = !!file, prompt = "> ";
$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const l = $("in").value + "\n";
  $("in").value = "", write(1, new TextEncoder().encode((running ? "" : prompt) + l));
  if (running) fut.type(l);
  else (prompt = await fut.line(l)), ($("prompt").textContent = prompt.trim());
});
const missing = file && !(await fetch("/" + file.replace(/^\/+/, ""), { method: "HEAD" })).ok;
if (missing) write(2, new TextEncoder().encode(`fut: there is no ${file} (the server serves files from its own checkout)\n`)), (running = false);
else if (file) {
  const path = "/" + file.replace(/^\/+/, "");
  new EventSource("/events").onmessage = (e) => watched.has(e.data) && fut.changed(e.data);
  const st = await (params.has("test") ? fut.test(path) : fut.run(path, true)).catch((e) => (write(2, new TextEncoder().encode(`[fut] ${e.message}\n`)), 1));
  running = false, write(2, new TextEncoder().encode(`[fut] exited (${st})\n`));
}
</script>
</body>
</html>
