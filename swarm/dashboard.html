<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swarm Dashboard</title>
<!-- swarm.fut writes this page to $SWARM_DIR/dashboard.html every round, with the run's data in place of DATA below. -->
<style>
:root {
  color-scheme: light;
  --surface-0: #f6f5f2; --surface-1: #fcfcfb; --border: #e4e2dc; --grid: #ecebe6;
  --text-primary: #0b0b0b; --text-secondary: #52514e; --text-muted: #8a8984;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-8: #e34948;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b;
  --track: #ecebe6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e87;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
    --track: #2e2e2b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-0: #121211; --surface-1: #1a1a19; --border: #2e2e2b; --grid: #262624;
  --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e87;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #0ca30c; --series-7: #9085e9; --series-8: #e66767;
  --track: #2e2e2b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--surface-0); color: var(--text-primary);
  font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 48px; }
h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
h2 { font-size: 13px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.04em; margin: 28px 0 10px; }
.mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
.muted { color: var(--text-muted); }
.sub { color: var(--text-secondary); margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--border);
  background: var(--surface-1); font-size: 12px; color: var(--text-secondary); white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; min-width: 0; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 18px; }
.tile .label { font-size: 12px; color: var(--text-secondary); }
.tile .value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
.tile .value small { font-size: 14px; font-weight: 500; color: var(--text-muted); }
.tile .note { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.bar { height: 6px; background: var(--track); border-radius: 3px; margin-top: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--series-1); border-radius: 3px; }
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 4px 0 10px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
.seg button { border: 0; background: none; color: var(--text-secondary); padding: 5px 12px; font: inherit; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--track); color: var(--text-primary); font-weight: 600; }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; }
.chart h3 { margin: 0 0 6px; font-size: 13px; font-weight: 600; }
.chart h3 span { font-weight: 400; color: var(--text-muted); }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.chart .axis { font-size: 10px; fill: var(--text-muted); }
.chart .gridline { stroke: var(--grid); stroke-width: 1; }
.tip { position: fixed; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 9px; font-size: 12px; box-shadow: 0 4px 16px rgba(0,0,0,.12); display: none; z-index: 10; white-space: nowrap; }
.tip b { font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--text-secondary); padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
td { padding: 6px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
.status { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; white-space: nowrap; }
.two { display: grid; grid-template-columns: 1.4fr 1fr; gap: 10px; }
@media (max-width: 820px) { .two { grid-template-columns: 1fr; } }
.log { max-height: 340px; overflow: auto; white-space: pre-wrap; word-break: break-word; margin: 0; color: var(--text-secondary); }
.log div { padding: 2px 0; border-bottom: 1px solid var(--grid); }
.empty { color: var(--text-muted); font-size: 13px; padding: 16px 0; text-align: center; }
.ctl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: start; }
@media (max-width: 900px) { .ctl { grid-template-columns: 1fr; } }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
.card-head h3 { margin: 0; font-size: 15px; font-weight: 650; }
.access { display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap; margin-bottom: 10px; padding: 10px 14px; }
.access .what { font-weight: 600; display: inline-flex; align-items: center; gap: 7px; }
.access form { display: flex; gap: 8px; margin-left: auto; flex: 1 1 280px; max-width: 420px; }
.access .err { color: var(--critical); font-size: 12px; flex-basis: 100%; }
.meter-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--text-secondary); }
.meter-top b { font-size: 18px; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
.fields { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
.fields .wide { grid-column: 1 / -1; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--text-secondary); min-width: 0; }
.affix { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-0); }
.affix span { padding: 0 8px; color: var(--text-muted); font-size: 13px; }
.affix input { border: 0; background: none; padding-left: 0; }
.affix span:last-child { padding-left: 0; }
.affix input:only-of-type:first-child { padding-left: 8px; }
.team { margin-top: 14px; border-top: 1px solid var(--grid); padding-top: 12px; }
.team-title { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
.role { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 10px; padding: 3px 0; font-size: 13px; }
.role small { display: block; color: var(--text-muted); font-size: 11px; }
input, select, textarea { font: inherit; font-size: 13px; color: var(--text-primary); background: var(--surface-0); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
input:focus-visible, select:focus-visible, .btn:focus-visible, .sc-row:focus-visible { outline: 2px solid var(--series-1); outline-offset: 1px; }
input:disabled, select:disabled { color: var(--text-secondary); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; align-items: center; }
.actions .spacer { flex: 1; }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  border-radius: 7px; padding: 6px 12px; cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { background: var(--track); }
.btn.primary { background: var(--series-1); border-color: var(--series-1); color: #fff; }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--series-1); }
.btn.danger { color: var(--critical); border-color: color-mix(in srgb, var(--critical) 45%, var(--border)); }
.btn.link { border: 0; background: none; padding: 6px 4px; color: var(--text-secondary); text-decoration: underline; text-underline-offset: 3px; }
.btn.link.danger { color: var(--critical); }
.btn:disabled { opacity: .45; cursor: default; }
.say { font-size: 12px; margin-top: 10px; min-height: 18px; color: var(--text-secondary); display: flex; align-items: center; gap: 6px; }
.say.ok { color: var(--good); } .say.err { color: var(--critical); }
.banner { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-0);
  font-size: 13px; margin-bottom: 12px; }
.banner .spacer { flex: 1; }
.sclist { display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.sc-row { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; border: 0; border-bottom: 1px solid var(--grid);
  background: none; color: var(--text-primary); font: inherit; padding: 8px 10px; cursor: pointer; }
.sc-row:last-child { border-bottom: 0; }
.sc-row:hover { background: var(--surface-0); }
.sc-row[aria-selected="true"] { background: var(--track); box-shadow: inset 3px 0 0 var(--series-1); }
.sc-row .n { font-weight: 600; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.sc-row .s { font-size: 12px; color: var(--text-muted); }
.sc-row.new .n { font-weight: 500; color: var(--text-secondary); }
.tag { font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); }
.editor { margin-top: 4px; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-secondary); margin-top: 12px; }
.check input { width: auto; }
.msg { font-size: 12px; color: var(--text-secondary); }
@media (max-width: 560px) { .fields { grid-template-columns: 1fr 1fr; } .role { grid-template-columns: 90px 1fr; } }
</style>
</head>
<body>
<main id="app"></main>
<div class="tip" id="tip" role="tooltip"></div>
<script id="data" type="application/json">/*DATA*/</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const money = (x) => "$" + (x ?? 0).toFixed(x >= 100 ? 0 : 2);
const dur = (s) => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h}h ${m}m` : m ? `${m}m ${s % 60}s` : `${s}s`; };
const pct = (a, b) => (b ? Math.round(100 * a / b) : 0);
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
let xKey = store.get("swarm.x", "t"), taskFilter = store.get("swarm.tasks", "active");
let dirty = false, editing = store.get("swarm.scenario", "") || null;  // null: not chosen yet, "": a new scenario
let runSay = null, nextSay = null, accessErr = "", sentRev = 0, draft = null;  // draft: the scenario form's values while edited
const served = location.protocol.startsWith("http");  // from the Worker: the controls can write to its KV
async function refresh() {  // new data every 15 s, unless a form is being edited
  if (dirty || document.activeElement?.matches("input, select, textarea")) return;
  if (!served) return location.reload();
  try {
    const html = await (await fetch(location.href, { cache: "no-store" })).text();
    const m = html.match(/<script id="data" type="application\/json">([\s\S]*?)<\/script>/);
    if (m) Object.assign(D, JSON.parse(m[1])), render();
  } catch {}
}
setInterval(refresh, 15000);

function statusOf() {
  const age = (Date.now() / 1000) - D.now;
  if (D.stopped) return { color: "var(--text-muted)", text: "stopped: " + D.stopped + (D.dash ? " · idle" : "") };
  if (D.paused) return { color: "var(--warning)", text: "paused" };
  if (age > 120) return { color: "var(--warning)", text: `not updated for ${dur(age)}` };
  return { color: "var(--good)", text: "running" };
}

function tiles() {
  const a = D.accept, t = D.tests || {};
  const capPct = Math.min(100, pct(D.spent, D.cap));
  const timeNote = D.minutes ? `of ${D.minutes} min limit` : "no time limit";
  return `<div class="tiles">
    <div class="card tile"><div class="label">Acceptance tests (hidden)</div>
      <div class="value">${a ? a.passed : "–"}<small> / ${a ? a.total : "–"}</small></div>
      <div class="bar"><i style="width:${a ? pct(a.passed, a.total) : 0}%"></i></div></div>
    <div class="card tile"><div class="label">Spent</div>
      <div class="value">${money(D.spent)}</div><div class="note">of ${money(D.cap)} cap</div>
      <div class="bar"><i style="width:${capPct}%"></i></div></div>
    <div class="card tile"><div class="label">Elapsed</div><div class="value">${dur(D.elapsed)}</div><div class="note">${timeNote}</div></div>
    <div class="card tile"><div class="label">Tasks merged</div><div class="value">${D.merged}</div>
      <div class="note">${D.rejected} review rejections · ${D.counts.failed} failed</div></div>
    <div class="card tile"><div class="label">Project's own tests</div><div class="value">${t.passed ?? 0}</div>
      <div class="note">${t.pending ?? 0} pending · ${(t.failed ?? 0) + (t.errors ?? 0)} failing</div></div>
    <div class="card tile"><div class="label">API calls</div><div class="value">${D.calls}</div>
      <div class="note">${money(D.calls ? D.spent / D.calls * 1000 : 0)} per 1,000</div></div>
  </div>`;
}

// ---- line charts: one series each (small multiples), one shared x: minutes or dollars ----
const X = { t: { label: "minutes", of: (p) => p.t / 60, fmt: (v) => v.toFixed(v < 10 ? 1 : 0) + " min" },
            spent: { label: "dollars", of: (p) => p.spent, fmt: (v) => "$" + v.toFixed(2) } };
function niceMax(v) { if (v <= 0) return 1; const e = 10 ** Math.floor(Math.log10(v)), f = v / e; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * e; }
function lineChart(id, series, yMax0, W = 320, H = 170) {  // series: [{name, color, pts: [[x, y]]}]; yMax0: a fixed top (a total)
  const L = 34, R = 8, T = 8, B = 22;
  const xs = series.flatMap((s) => s.pts.map((p) => p[0])), ys = series.flatMap((s) => s.pts.map((p) => p[1]));
  if (!xs.length) return `<svg id="${id}" viewBox="0 0 ${W} ${H}"></svg><div class="empty">no data yet</div>`;
  const xMax = niceMax(Math.max(...xs, 1e-9)), yMax = yMax0 || niceMax(Math.max(...ys, 1));
  const sx = (v) => L + (W - L - R) * v / xMax, sy = (v) => T + (H - T - B) * (1 - v / yMax);
  let g = "";
  for (let i = 0; i <= 4; i++) {
    const v = yMax * i / 4, y = sy(v);
    g += `<line class="gridline" x1="${L}" x2="${W - R}" y1="${y}" y2="${y}"/><text class="axis" x="${L - 5}" y="${y + 3}" text-anchor="end">${+v.toFixed(2)}</text>`;
  }
  for (let i = 0; i <= 4; i++) { const v = xMax * i / 4; g += `<text class="axis" x="${sx(v)}" y="${H - 6}" text-anchor="middle">${+v.toFixed(2)}</text>`; }
  for (const s of series) {
    if (!s.pts.length) continue;
    const d = s.pts.map((p, i) => (i ? "L" : "M") + sx(p[0]).toFixed(1) + " " + sy(p[1]).toFixed(1)).join("");
    g += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = s.pts[s.pts.length - 1];
    g += `<circle cx="${sx(last[0])}" cy="${sy(last[1])}" r="4" fill="${s.color}" stroke="var(--surface-1)" stroke-width="2"/>`;
  }
  g += `<line class="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--text-muted)" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>`;
  g += `<rect x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent" class="hit"/>`;
  charts[id] = { series, sx, sy, xMax, L, R, W };
  return `<svg id="${id}" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
const charts = {};
function hover(e) {
  const svg = e.currentTarget, c = charts[svg.id], tip = $("#tip");
  if (!c) return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) * (c.W / r.width);
  const xv = Math.max(0, Math.min(c.xMax, (vx - c.L) / (c.W - c.L - c.R) * c.xMax));
  let rows = "", at = null;
  for (const s of c.series) {
    let best = null;
    for (const p of s.pts) if (!best || Math.abs(p[0] - xv) < Math.abs(best[0] - xv)) best = p;
    if (!best) continue;
    at = at ?? best[0];
    rows += `<div><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${s.color};margin-right:6px"></i>${esc(s.name)}: <b>${esc(s.fmt ? s.fmt(best[1]) : best[1])}</b></div>`;
  }
  if (at == null) return;
  const xh = svg.querySelector(".xh");
  xh.setAttribute("x1", c.sx(at)), xh.setAttribute("x2", c.sx(at)), xh.setAttribute("visibility", "visible");
  tip.innerHTML = `<div class="muted">${X[xKey].fmt(at)}</div>` + rows;
  tip.style.display = "block";
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(window.innerWidth - tw - 8, e.clientX + 14) + "px", tip.style.top = (e.clientY + 14) + "px";
}
function unhover(e) { $("#tip").style.display = "none"; e.currentTarget.querySelector(".xh")?.setAttribute("visibility", "hidden"); }

function runCharts() {
  const tl = D.timeline || [], x = X[xKey].of, c1 = "var(--series-1)";
  const one = (name, y, fmt) => [{ name, color: c1, fmt, pts: tl.filter((p) => y(p) != null).map((p) => [x(p), y(p)]) }];
  const other = xKey == "t"
    ? { title: "Spent", unit: "dollars", s: one("spent", (p) => p.spent, (v) => "$" + v.toFixed(2)) }
    : { title: "Elapsed", unit: "minutes", s: one("elapsed", (p) => p.t / 60, (v) => v.toFixed(1) + " min") };
  const blocks = [
    { title: "Acceptance tests passing", unit: D.accept ? "of " + D.accept.total : "", s: one("acceptance", (p) => p.accept), max: D.accept?.total },
    { title: "Project's own tests passing", unit: "count", s: one("tests", (p) => p.tests) },
    { title: "Tasks merged", unit: "count", s: one("merged", (p) => p.merged) },
    other,
  ];
  return `<div class="charts">${blocks.map((b, i) => `<div class="card chart"><h3>${b.title} <span>· ${b.unit}, by ${X[xKey].label}</span></h3>${lineChart("c" + i, b.s, b.max)}</div>`).join("")}</div>`;
}

function workersTable() {
  const rows = (D.workerList || []).map((w) => {
    const color = w.phase == "work" ? "var(--series-1)" : w.phase == "review" ? "var(--series-4)" : "var(--text-muted)";
    return `<tr><td class="mono">w${w.i}</td><td><span class="status"><span class="dot" style="background:${color}"></span>${esc(w.phase)}</span></td>
      <td>${w.task ? `<span class="muted">#${w.task.id}</span> ${esc(w.task.title)}` : '<span class="muted">–</span>'}</td><td class="num">${w.task ? w.steps : ""}</td></tr>`;
  }).join("");
  return `<div class="card scroll"><table><thead><tr><th>Worker</th><th>Phase</th><th>Task</th><th class="num">Step</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function costTable() {
  const by = Object.entries(D.byModel || {}).sort((a, b) => b[1] - a[1]);
  const rows = by.map(([m, v]) => `<tr><td class="mono">${esc(m)}</td><td class="num">${money(v)}</td><td class="num">${pct(v, D.spent)}%</td></tr>`).join("");
  const roles = Object.entries(D.models || {}).map(([r, m]) => `<tr><td>${esc(r)}</td><td class="mono">${esc(m)}</td></tr>`).join("");
  return `<div class="card"><table><thead><tr><th>Spend by model</th><th class="num">Dollars</th><th class="num">Share</th></tr></thead><tbody>${rows || '<tr><td colspan="3" class="muted">nothing yet</td></tr>'}</tbody></table>
    <table style="margin-top:12px"><thead><tr><th>Role</th><th>Model</th></tr></thead><tbody>${roles}</tbody></table></div>`;
}

function tasksBlock() {
  const order = ["active", "queued", "done", "failed"], tasks = (D.tasks || []).slice().sort((a, b) => b.id - a.id);
  const shown = tasks.filter((t) => t.status == taskFilter);
  const seg = order.map((s) => `<button data-task="${s}" aria-pressed="${s == taskFilter}">${s} ${D.counts[s] ?? 0}</button>`).join("");
  const rows = shown.map((t) => `<tr><td class="mono muted">#${t.id}</td><td>${esc(t.title)}</td><td class="num">${t.attempts || 0}</td><td class="mono muted">${esc((t.files || []).join(", "))}</td></tr>`).join("");
  return `<div class="controls"><div class="seg" role="group" aria-label="Task status">${seg}</div></div>
    <div class="card scroll">${shown.length ? `<table><thead><tr><th>Id</th><th>Task</th><th class="num">Attempts</th><th>Files</th></tr></thead><tbody>${rows}</tbody></table>` : '<div class="empty">none</div>'}</div>`;
}

function runsBlock() {
  const runs = (D.runs || []).slice().sort((a, b) => (a.run < b.run ? -1 : 1));
  if (!runs.length) return '<div class="card"><div class="empty">no finished or saved runs yet</div></div>';
  const x = X[xKey].of, colors = ["var(--series-1)", "var(--series-2)", "var(--series-3)", "var(--series-4)", "var(--series-5)", "var(--series-6)", "var(--series-7)", "var(--series-8)"];
  const recent = runs.slice(-8), series = recent.map((r, i) => ({ name: r.run, color: colors[i], pts: (r.timeline || []).filter((p) => p.accept != null).map((p) => [x(p), p.accept]) }));
  const total = Math.max(...recent.map((r) => r.accept?.total || 0));
  const cp = (r, k) => { const p = r.checkpoints?.[k]; return p ? (p.accept ?? "–") : ""; };
  const keys = ["10m", "30m", "60m", "$1", "$5"];
  const rows = runs.slice().reverse().map((r) => {
    const models = [...new Set(Object.values(r.models || {}))].map((m) => m.replace("claude-", "")).join(", ");
    return `<tr><td class="mono">${esc(r.run)}</td><td>${esc(r.target)}</td><td class="mono">${esc(models)}</td><td class="num">${r.workers}</td>
      <td class="num">${dur(r.elapsed)}</td><td class="num">${money(r.spent)}</td><td class="num">${r.merged}</td><td class="num">${r.tests ?? ""}</td>
      <td class="num"><b>${r.accept ? r.accept.passed + " / " + r.accept.total : "–"}</b></td>${keys.map((k) => `<td class="num">${cp(r, k)}</td>`).join("")}
      <td class="num">${r.srcLines ?? ""}</td><td class="mono muted">${esc(r.fut || "")}</td></tr>`;
  }).join("");
  const legend = series.length > 1 ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>` : "";
  return `<div class="card chart"><h3>Acceptance tests passing, per run <span>· by ${X[xKey].label}</span></h3>${lineChart("runs", series, total, Math.max(320, Math.min(960, window.innerWidth - 64)), 220)}${legend}</div>
    <div class="card scroll" style="margin-top:10px"><table><thead><tr><th>Run</th><th>Target</th><th>Models</th><th class="num">Workers</th><th class="num">Time</th>
    <th class="num">Spent</th><th class="num">Merged</th><th class="num">Own tests</th><th class="num">Acceptance</th>${keys.map((k) => `<th class="num">at ${k}</th>`).join("")}
    <th class="num">Src lines</th><th>fut</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

// ---- controls: they write the swarm's control document (and the scenarios) to the Worker's KV; the swarm reads it
// every 10 s and applies it (D.control is what it applied last) ----
const token = () => store.get("swarm.token", "");
const unlocked = () => !!token();
const ROLES = [["worker", "writes the code"], ["planner", "proposes tasks"], ["approver", "accepts tasks"], ["reviewer", "reviews each diff"]];
const modelName = (m) => (m || "").replace(/^claude-/, "").replace(/-(\d+)-(\d+)$/, " $1.$2").replace(/^./, (c) => c.toUpperCase());
async function kv(key, value) {
  const headers = { authorization: "Bearer " + token() };
  const r = value === undefined ? await fetch("/kv/" + key, { headers, cache: "no-store" })
    : await fetch("/kv/" + key, { method: "PUT", headers: { ...headers, "content-type": "application/json" }, body: JSON.stringify(value) });
  if (r.status == 401) { store.set("swarm.token", ""), (accessErr = "That token was refused. Unlock again with the Worker's FUT_TOKEN."); throw new Error("the token was refused"); }
  if (!r.ok) throw new Error((value === undefined ? "read" : "write") + " failed: HTTP " + r.status);
  return value === undefined ? r.json() : null;
}
async function control(change) {  // read, change, write back with the next revision
  const c = (await kv("control")) || {};
  if (c.run != D.run.id) delete c.live, delete c.pause, delete c.stop;  // what was set for an earlier run
  change(c);
  c.rev = (c.rev || 0) + 1;
  await kv("control", c);
  D.control = { ...(D.control || {}), next: c.next };
  return c.rev;
}
async function act(set, busy, f) {  // set(msg): runSay or nextSay
  set({ text: busy + "…" }), render();
  try { set({ text: await f(), kind: "ok" }), (dirty = false); }
  catch (e) { set({ text: e.message, kind: "err" }); }
  render();
}
const setRun = (m) => (runSay = m), setNext = (m) => (nextSay = m);
const val = (id) => { const v = $("#" + id)?.value.trim(); return v == "" || v == null ? undefined : +v; };
const say = (m) => `<div class="say ${m?.kind || ""}" role="status" aria-live="polite">${m ? esc(m.text) : ""}</div>`;
const opts = (sel, extra = "") => extra + D.knownModels.map((m) => `<option value="${esc(m)}" ${m == sel ? "selected" : ""}>${esc(modelName(m))}</option>`).join("");
function summary(sc) {
  const models = [...new Set([sc.model, ...Object.values(sc.models || {})].filter(Boolean))].map(modelName).join(" + ");
  return [sc.target, (sc.workers || 8) + " workers", "$" + (sc.cap ?? "–") + " cap", sc.minutes ? sc.minutes + " min" : "no time limit", models].join(" · ");
}

function accessBar() {
  if (unlocked()) return `<div class="card access"><span class="what"><span class="dot" style="background:var(--good)"></span>Controls unlocked</span>
    <span class="muted" style="font-size:12px">The token is kept in this browser only.</span><span style="flex:1"></span><button class="btn link" id="b-lock">Lock</button></div>`;
  return `<div class="card access"><span class="what"><span class="dot" style="background:var(--text-muted)"></span>Read-only</span>
    <span class="muted" style="font-size:12px">Anyone with the link can watch. Changing the swarm needs the Worker's token.</span>
    <form id="unlock" autocomplete="off"><input id="f-token" type="password" placeholder="FUT_TOKEN" aria-label="Worker token"><button class="btn primary">Unlock</button></form>
    ${accessErr ? `<div class="err" role="alert">${esc(accessErr)}</div>` : ""}</div>`;
}

function runCard() {
  const live = !D.stopped, can = live && unlocked(), dis = can ? "" : "disabled", st = statusOf();
  const pending = sentRev && (D.control?.rev || 0) < sentRev;
  const capPct = Math.min(100, pct(D.spent, D.cap));
  const team = ROLES.map(([r, what]) => `<div class="role"><label for="f-m-${r}">${r}<small>${what}</small></label><select id="f-m-${r}" ${dis}>${opts(D.models[r])}</select></div>`).join("");
  return `<div class="card"><div class="card-head"><h3>This run</h3><span class="pill"><span class="dot" style="background:${st.color}"></span>${esc(st.text)}</span></div>
    <div class="meter-top"><span><b>${money(D.spent)}</b> spent</span><span>of ${money(D.cap)} cap</span></div>
    <div class="bar"><i style="width:${capPct}%"></i></div>
    <div class="note">All runs together: ${money(D.globalSpent)} of the ${money(D.globalCap)} hard cap · running ${dur(D.elapsed)}</div>
    <div class="fields">
      <label class="field">Workers<input id="f-workers" type="number" inputmode="numeric" min="1" max="32" value="${D.nworkers}" ${dis}></label>
      <label class="field">Budget cap<span class="affix"><span>$</span><input id="f-cap" type="number" inputmode="decimal" step="0.5" min="0" value="${D.cap}" ${dis}></span></label>
      <label class="field">Time limit<span class="affix"><input id="f-min" type="number" inputmode="numeric" min="0" value="${D.minutes || ""}" placeholder="none" ${dis}><span>min</span></span></label>
    </div>
    <div class="team"><div class="team-title">Team</div>${team}</div>
    <div class="actions"><button class="btn primary" id="b-apply" disabled>Apply changes</button><button class="btn link" id="b-discard" hidden>Discard</button>
      <span class="spacer"></span><button class="btn" id="b-pause" ${dis}>${D.paused ? "Resume" : "Pause"}</button><button class="btn danger" id="b-stop" ${dis}>Stop run</button></div>
    ${say(pending ? { text: "Sent. The swarm picks changes up within about 10 seconds." } : runSay)}
    ${live ? "" : `<div class="note">This run is over. Start the next one from the scenarios.</div>`}</div>`;
}

function scenarioForm(sc, name) {
  const can = unlocked(), dis = can ? "" : "disabled", m = sc.models || {};
  const same = (r) => `<option value="" ${m[r] ? "" : "selected"}>Same as workers</option>`;
  const team = ROLES.map(([r, what]) => `<div class="role"><label for="s-m-${r}">${r}<small>${what}</small></label>
    <select id="s-m-${r}" ${dis}>${r == "worker" ? opts(sc.model || D.knownModels[0]) : same(r) + D.knownModels.map((x) => `<option value="${esc(x)}" ${x == m[r] ? "selected" : ""}>${esc(modelName(x))}</option>`).join("")}</select></div>`).join("");
  return `<div class="editor"><div class="fields">
      <label class="field">Name<input id="s-name" value="${esc(name)}" placeholder="e.g. fsql-sonnet" pattern="[A-Za-z0-9_\\-][A-Za-z0-9._\\-]*" ${dis}></label>
      <label class="field">Project<select id="s-target" ${dis}>${D.targets.map((t) => `<option ${t == sc.target ? "selected" : ""}>${esc(t)}</option>`).join("")}</select></label>
      <label class="field">Workers<input id="s-workers" type="number" min="1" max="32" value="${sc.workers ?? 8}" ${dis}></label>
      <label class="field wide">Description<input id="s-desc" value="${esc(sc.description || "")}" placeholder="what this run compares" ${dis}></label>
      <label class="field">Budget cap<span class="affix"><span>$</span><input id="s-cap" type="number" step="0.5" min="0" value="${sc.cap ?? 5}" ${dis}></span></label>
      <label class="field">Time limit<span class="affix"><input id="s-min" type="number" min="0" value="${sc.minutes || ""}" placeholder="none" ${dis}><span>min</span></span></label>
    </div>
    <div class="team"><div class="team-title">Team</div>${team}</div>
    <label class="check"><input type="checkbox" id="s-cf" ${sc.cfTests ? "checked" : ""} ${dis}>Run the tests on the Cloudflare Worker (slower than local for CPU-heavy suites)</label></div>`;
}

function nextCard() {
  const names = Object.keys(D.scenarios || {}).sort(), live = !D.stopped, can = unlocked();
  if (editing == null || (editing != "" && !names.includes(editing))) editing = names.includes(D.control?.next) ? D.control.next : names.includes(D.scenario) ? D.scenario : names[0] || "";
  const sc = draft || D.scenarios?.[editing] || { description: "", target: D.targets[0], workers: 8, model: D.knownModels[0], cap: 5, minutes: 60 };
  const queued = D.control?.next;
  const rows = names.map((n) => `<button class="sc-row" role="option" data-sc="${esc(n)}" aria-selected="${n == editing}">
      <span class="n">${esc(n)}${n == D.scenario && live ? '<span class="tag">running</span>' : ""}${n == queued ? '<span class="tag">queued next</span>' : ""}</span>
      <span class="s">${esc(D.scenarios[n].description || summary(D.scenarios[n]))}</span></button>`).join("");
  const start = live ? `<button class="btn danger" id="b-now" ${can ? "" : "disabled"}>Stop this run and start</button>
      <button class="btn primary" id="b-next" ${can ? "" : "disabled"}>Queue next</button>`
    : `<button class="btn primary" id="b-now" ${can ? "" : "disabled"}>Start this run</button>`;
  return `<div class="card"><div class="card-head"><h3>Next run</h3><span class="muted" style="font-size:12px">${names.length} scenario${names.length == 1 ? "" : "s"}</span></div>
    ${queued ? `<div class="banner"><span class="dot" style="background:var(--series-1)"></span><span>Queued next: <b>${esc(queued)}</b>${live ? ", when this run ends" : ""}</span><span class="spacer"></span>
      <button class="btn link" id="b-unqueue" ${can ? "" : "disabled"}>Cancel</button></div>` : ""}
    <div class="sclist" role="listbox" aria-label="Scenarios">${rows}
      <button class="sc-row new" role="option" data-sc="" aria-selected="${editing == ""}"><span class="n">+ New scenario</span></button></div>
    ${scenarioForm(sc, editing)}
    <div class="actions"><button class="btn" id="b-save" disabled>Save</button>${editing ? `<button class="btn link danger" id="b-del" ${can ? "" : "disabled"}>Delete</button>` : ""}
      <span class="spacer"></span>${start}</div>
    ${say(nextSay)}</div>`;
}

function controlsBlock() {
  if (!served || !D.dash) return `<div class="card"><div class="msg">Controls work on the dashboard the Worker serves (SWARM_DASH_URL).</div></div>`;
  return accessBar() + `<div class="ctl">${runCard()}${nextCard()}</div>`;
}

function scenarioFromForm() {
  const name = $("#s-name").value.trim();
  if (!/^[A-Za-z0-9_-][A-Za-z0-9._-]*$/.test(name)) throw new Error("Give the scenario a name: letters, digits, . _ -");
  const sc = { description: $("#s-desc").value.trim(), target: $("#s-target").value, workers: val("s-workers") ?? 8, model: $("#s-m-worker").value,
    cap: val("s-cap") ?? 5, minutes: val("s-min") ?? 0 };
  const models = {};
  for (const [r] of ROLES.slice(1)) if ($("#s-m-" + r).value) models[r] = $("#s-m-" + r).value;
  if (Object.keys(models).length) sc.models = models;
  if ($("#s-cf").checked) sc.cfTests = true;
  if (!(sc.workers >= 1 && sc.workers <= 32)) throw new Error("Workers: 1 to 32");
  if (!(sc.cap > 0)) throw new Error("The budget cap must be above $0");
  return [name, sc];
}
async function saveScenario() {
  const [name, sc] = scenarioFromForm(), all = (await kv("scenarios")) || {};
  if (JSON.stringify(all[name]) != JSON.stringify(sc)) all[name] = sc, await kv("scenarios", all);
  D.scenarios = all, editing = name, draft = null, store.set("swarm.scenario", name);
  return name;
}
function runChanged() {
  if (D.stopped) return false;
  const same = val("f-workers") == D.nworkers && val("f-cap") == D.cap && (val("f-min") ?? 0) == (D.minutes || 0);
  return !same || ROLES.some(([r]) => $("#f-m-" + r).value != D.models[r]);
}
function wireControls() {
  $("#unlock")?.addEventListener("submit", async (e) => {
    e.preventDefault();
    const t = $("#f-token").value.trim();
    if (!t) return;
    store.set("swarm.token", t), (accessErr = "");
    try { await kv("control"); } catch (err) { accessErr ||= err.message; }
    render();
  });
  $("#b-lock")?.addEventListener("click", () => { store.set("swarm.token", ""), (runSay = nextSay = null), render(); });
  // this run
  const syncRun = () => { const c = runChanged(); $("#b-apply").disabled = !c || !unlocked(); $("#b-discard").hidden = !c; dirty = c; };
  for (const el of document.querySelectorAll("#f-workers, #f-cap, #f-min, [id^=f-m-]")) el.addEventListener("input", syncRun);
  $("#b-discard")?.addEventListener("click", () => { dirty = false, render(); });
  $("#b-apply")?.addEventListener("click", () => act(setRun, "Sending", async () => {
    const models = {};
    for (const [r] of ROLES) models[r] = $("#f-m-" + r).value;
    sentRev = await control((c) => { c.run = D.run.id, c.live = { workers: val("f-workers"), cap: val("f-cap"), minutes: val("f-min") ?? 0, models }, c.stop = false; });
    return "Sent. The swarm picks changes up within about 10 seconds.";
  }));
  $("#b-pause")?.addEventListener("click", () => act(setRun, D.paused ? "Resuming" : "Pausing", async () => {
    sentRev = await control((c) => { c.run = D.run.id, c.pause = !D.paused; });
    return D.paused ? "Resume sent." : "Pause sent: workers stop after their current step.";
  }));
  $("#b-stop")?.addEventListener("click", () => confirm(`Stop ${D.run.id}? It ends after the current round, and the dashboard then waits for the next run.`) &&
    act(setRun, "Stopping", async () => { sentRev = await control((c) => { c.run = D.run.id, c.stop = true; }); return "Stop sent: the run ends after this round."; }));
  // next run
  for (const b of document.querySelectorAll("[data-sc]")) b.addEventListener("click", () => {
    if (dirty && draft && !confirm("Discard your unsaved changes to this scenario?")) return;
    editing = b.dataset.sc, draft = null, dirty = false, nextSay = null, editing && store.set("swarm.scenario", editing), render();
  });
  const syncNext = () => {
    let changed = true;
    try { const [n, sc] = scenarioFromForm(); changed = n != editing || JSON.stringify(sc) != JSON.stringify(D.scenarios?.[editing]); } catch {}
    $("#b-save").disabled = !changed || !unlocked();
    dirty = changed;
  };
  for (const el of document.querySelectorAll(".editor input, .editor select")) el.addEventListener("input", syncNext);
  $("#b-save")?.addEventListener("click", () => act(setNext, "Saving", async () => "Saved " + (await saveScenario()) + "."));
  $("#b-del")?.addEventListener("click", () => confirm(`Delete the scenario ${editing}?`) && act(setNext, "Deleting", async () => {
    const all = (await kv("scenarios")) || {}, n = editing;
    delete all[n], await kv("scenarios", all), (D.scenarios = all), (editing = ""), (draft = null);
    return "Deleted " + n + ".";
  }));
  $("#b-next")?.addEventListener("click", () => act(setNext, "Queueing", async () => {
    const n = await saveScenario();
    await control((c) => { c.next = n; });
    return `${n} starts when this run ends.`;
  }));
  $("#b-now")?.addEventListener("click", () => {
    let n;
    try { n = scenarioFromForm()[0]; } catch (e) { return (nextSay = { text: e.message, kind: "err" }), render(); }
    if (!D.stopped && !confirm(`Stop ${D.run.id} now and start ${n}? The current run ends after this round.`)) return;
    act(setNext, "Starting", async () => {
      const name = await saveScenario();
      await control((c) => { c.next = name; if (!D.stopped) c.run = D.run.id, c.stop = true; });
      return D.stopped ? `${name} starts within about 10 seconds.` : `This run stops after its round, then ${name} starts.`;
    });
  });
  $("#b-unqueue")?.addEventListener("click", () => act(setNext, "Cancelling", async () => { await control((c) => { c.next = null; }); return "Nothing queued."; }));
}

function render() {
  const st = statusOf();
  $("#app").innerHTML = `
    <header><div><h1>${esc(D.target)} swarm</h1>
      <div class="sub"><span class="mono">${esc(D.run?.id)}</span>${D.scenario ? `<span>scenario ${esc(D.scenario)}</span>` : ""}<span>${D.nworkers} workers</span><span>fut ${esc(D.run?.fut)}</span>
      <span>updated ${new Date(D.now * 1000).toLocaleTimeString()}</span></div></div>
      <span class="pill"><span class="dot" style="background:${st.color}"></span>${esc(st.text)}</span></header>
    ${tiles()}
    <h2>Control</h2>${controlsBlock()}
    <h2>Progress</h2>
    <div class="controls"><span class="muted" style="font-size:12px">x axis</span><div class="seg" role="group" aria-label="x axis">
      <button data-x="t" aria-pressed="${xKey == "t"}">Time</button><button data-x="spent" aria-pressed="${xKey == "spent"}">Spend</button></div></div>
    ${runCharts()}
    <h2>Workers</h2><div class="two">${workersTable()}${costTable()}</div>
    <h2>Tasks</h2>${tasksBlock()}
    <h2>Runs</h2>${runsBlock()}
    <h2>Recent events</h2><div class="card"><div class="log mono">${(D.events || []).slice().reverse().map((e) => `<div>${esc(e)}</div>`).join("")}</div></div>`;
  for (const svg of document.querySelectorAll("svg[id]")) svg.addEventListener("pointermove", hover), svg.addEventListener("pointerleave", unhover);
  for (const b of document.querySelectorAll("[data-x]")) b.onclick = () => { xKey = b.dataset.x, store.set("swarm.x", xKey), render(); };
  wireControls();
  for (const b of document.querySelectorAll("[data-task]")) b.onclick = () => { taskFilter = b.dataset.task, store.set("swarm.tasks", taskFilter), render(); };
}
render();
</script>
</body>
</html>
